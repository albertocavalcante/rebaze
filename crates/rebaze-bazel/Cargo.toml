[package]
name = "rebaze-bazel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bazel file generator for rebaze"

[lints]
workspace = true

[dependencies]
rebaze-bcr.workspace = true
rebaze-cmake.workspace = true
rebaze-gradle.workspace = true
rebaze-starlark.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tempfile = "3"
serde_json.workspace = true
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[dev-dependencies]
starlark_syntax = "0.13"
