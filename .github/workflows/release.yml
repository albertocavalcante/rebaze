name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g., v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub release and update the Homebrew tap"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rebaze

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Builds and publication use this immutable commit, never the dispatching ref.
      - name: Resolve tag to commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: bash .github/scripts/release-source.sh resolve

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - os: ubuntu-24.04
            name: linux-amd64
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04
            name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true

          # Linux MUSL (static, portable)
          - os: ubuntu-24.04
            name: linux-amd64-musl
            target: x86_64-unknown-linux-musl
            cross: false
            musl: true

          # macOS
          - os: macos-15
            name: darwin-arm64
            target: aarch64-apple-darwin
            cross: false
          - os: macos-15
            name: darwin-amd64
            target: x86_64-apple-darwin
            cross: true

          # Windows
          - os: windows-2022
            name: windows-amd64
            target: x86_64-pc-windows-msvc
            cross: false
            ext: .exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Inline so every platform and any tag commit can run it without repository scripts.
      - name: Verify release source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          actual="$(git rev-parse --verify HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out $actual but the release tag resolves to $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p rebaze-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} LICENSE dist/
          cd dist
          tar -czvf ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz ${{ env.BINARY_NAME }} LICENSE
          shasum -a 256 ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz > ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz.sha256
          rm ${{ env.BINARY_NAME }} LICENSE

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" -Destination "dist/"
          Copy-Item "LICENSE" -Destination "dist/"
          Set-Location dist
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe", "LICENSE" -DestinationPath "${{ env.BINARY_NAME }}-${{ matrix.name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ env.BINARY_NAME }}-${{ matrix.name }}.zip").Hash.ToLower()
          "$hash  ${{ env.BINARY_NAME }}-${{ matrix.name }}.zip" | Out-File -Encoding ASCII "${{ env.BINARY_NAME }}-${{ matrix.name }}.zip.sha256"
          Remove-Item "${{ env.BINARY_NAME }}.exe", "LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.name }}
          path: |
            dist/${{ env.BINARY_NAME }}-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  # Assembles assets and notes for every run, including non-publishing rehearsals.
  assemble:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    name: Assemble release
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          {
            printf '## rebaze %s\n\n' "$TAG"
            printf 'Built from commit %s.\n\n' "$SHA"
            cat << 'EOF'
          CLI tool to migrate projects from other build systems (Gradle, Maven, CMake) to Bazel.

          ### Installation

          **Homebrew (macOS/Linux):**
          ```bash
          brew install albertocavalcante/tap/rebaze
          ```

          **Manual download:**
          Download the appropriate archive for your platform from the assets below.

          ### Checksums

          EOF
            echo '```'
            cat release-assets/*.sha256
            echo '```'
          } > release-notes.md

      - name: Record release summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PUBLISH: ${{ needs.resolve.outputs.publish }}
        run: |
          {
            printf '### Release %s\n\n' "$TAG"
            printf -- '- Source commit: %s\n' "$SHA"
            printf -- '- Publish: %s\n\n' "$PUBLISH"
            echo '```'
            (cd release-assets && ls -l)
            echo
            cat release-assets/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, assemble]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    name: Publish release
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release source
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          bash .github/scripts/release-source.sh verify-head "$EXPECTED_SHA"
          bash .github/scripts/release-source.sh verify-remote-tag "$TAG" "$EXPECTED_SHA"

      - name: Download release bundle
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-bundle
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: Release ${{ needs.resolve.outputs.tag }}
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Eukia App Token
        id: eukia
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        continue-on-error: true
        with:
          app-id: ${{ vars.EUKIA_APP_ID }}
          private-key: ${{ secrets.EUKIA_APP_PRIVATE_KEY }}
          owner: albertocavalcante
          repositories: homebrew-tap

      - name: Update Homebrew tap
        if: steps.eukia.outcome == 'success' && needs.resolve.outputs.prerelease != 'true'
        uses: albertocavalcante/actions/update-homebrew-tap@15b779ac6b45f756c3579473fd1a9dce71f93fe3 # No corresponding version tag
        continue-on-error: true
        with:
          tap-repo: albertocavalcante/homebrew-tap
          formula-name: rebaze
          version: ${{ needs.resolve.outputs.tag }}
          template: packaging/homebrew/rebaze.rb.in
          github-token: ${{ steps.eukia.outputs.token }}
          git-user-name: "Eukia[bot]"
          git-user-email: "eukia[bot]@users.noreply.github.com"
          assets: |
            {
              "darwin-arm64": {
                "url": "https://github.com/albertocavalcante/rebaze/releases/download/${{ needs.resolve.outputs.tag }}/rebaze-darwin-arm64.tar.gz"
              },
              "darwin-x64": {
                "url": "https://github.com/albertocavalcante/rebaze/releases/download/${{ needs.resolve.outputs.tag }}/rebaze-darwin-amd64.tar.gz"
              },
              "linux-arm64": {
                "url": "https://github.com/albertocavalcante/rebaze/releases/download/${{ needs.resolve.outputs.tag }}/rebaze-linux-aarch64.tar.gz"
              },
              "linux-x64": {
                "url": "https://github.com/albertocavalcante/rebaze/releases/download/${{ needs.resolve.outputs.tag }}/rebaze-linux-amd64.tar.gz"
              }
            }
