name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    permissions:
      contents: read
    name: Bazel Build & Test
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install verified Bazel
        run: bash .github/scripts/setup-bazel.sh

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-cache: false
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //... --jobs=2

      - name: Test
        run: bazel test //... --jobs=2 --test_output=errors

  cargo:
    permissions:
      contents: read
    name: Cargo Check
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      # Keep toolchains off /tmp (noexec tmpfs) and bound the 4 GiB runner workload.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: none

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Test tool bootstrap failure handling
        run: bash .github/scripts/setup-tools.test.sh

      - name: Set up pinned Rust toolchain
        run: bash .github/scripts/setup-rust.sh

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Install verified fixture tools
        run: |
          bash .github/scripts/setup-bazel.sh
          bash .github/scripts/setup-cmake.sh

      - name: Required CMake CLI migration
        run: bash .github/scripts/test-cmake-migration.sh target/debug/rebaze
