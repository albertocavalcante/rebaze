# Copy to rebaze.toml and edit for your project. See docs/reference/config on the site.
# These are generation settings; validate the resulting project before relying on it.

[versions]
rules_cc = "0.2.27"
platforms = "0.0.11"
rules_foreign_cc = "0.14.0"
googletest = "1.15.2"
google_benchmark = "1.9.1"

# Implemented managed pkg-config strategies: system, source, bcr.
# Unsupported spellings fail planning, including unused overrides.
[strategy]
default = "system"
bcr_fallback = "system" # system or source, for unresolved/skipped BCR selections

# A normalized CMake prefix override wins over package/catalog overrides.
# Change this file and regenerate; generated third_party/config.bzl is inspection data.
[strategy.overrides]
# compression = "source" # pkg_check_modules(COMPRESSION REQUIRED zlib)
# zlib = "source"

[strategy.bcr.version_pins]
# zlib = "1.3.1.bcr.5"

# Replacement modules must preserve original package/target layouts.
[strategy.bcr.module_overrides]

# Non-pkg CMake link mappings remain explicit. Supply compatible MODULE.bazel
# declarations for custom external repositories; a target mapping does not add one.
[mappings.system_libraries]
# custom = "@my_repository//:custom"

[mappings.plain_libraries]
# custom = "@my_repository//:custom"

[mappings]
implicit_system_libs = ["pthread", "c", "m", "dl", "rt"]
ignored_libraries = ["Threads::Threads"]

[mappings.transitive_deps]
# Source transitives inherit source unless overridden. Cycles fail planning.
# my_package = ["zlib"]

# A full source entry replaces the catalog entry for that key. zlib is built in;
# this commented example shows all fields used for a custom source entry.
# [mappings.known_packages.zlib]
# version = "1.3.1"
# url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
# sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
# strip_prefix = "zlib-1.3.1"
# build_system = "cmake" # cmake, meson, autotools
# pkg_config_packages = ["zlib"] # For system overrides of source transitives
# out_static_libs = ["libz.a"]
# out_shared_libs = [] # Static outputs take precedence when both are present
# deps = []
# build_options = ["-DBUILD_SHARED_LIBS=OFF"]

[build]
module_version = "0.1.0"

[build.rules]
library_rule = "cc_library"
binary_rule = "cc_binary"
# Custom rules need matching loads. Native CMake test generation is not complete.
# [[build.rules.extra_loads]]
# bzl = "@company//build:rules.bzl"
# items = ["company_library", "company_binary"]
