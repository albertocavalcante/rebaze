# Base directory for outputs. Leave empty to use REBAZE_CMAKE_CORPUS_DIR,
# then a repo-local ".rebaze/cmake-corpus", then XDG_CACHE_HOME,
# then the OS temp directory.
corpus_dir = ""
count = 100
# CMakeLists size filters (bytes). Leave empty to auto-expand until enough results.
size_min = 0
size_max = ""
# Optional overrides (leave empty to use corpus_dir).
workdir = ""
out = ""
max_per_repo = 3
per_page = 100
query_extra = ""
no_fetch = false
wait = false
sleep = 0.0
# Search backend: "github" or "sourcegraph".
search_backend = "github"
# For Sourcegraph, limit number of results to fetch (0 = auto).
search_limit = 0
allow_license = []
deny_license = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]
skip_unknown_license = false
exact_basename = true
filter_invalid = true
# Cache settings for GitHub search results.
cache_enabled = true
cache_ttl_seconds = 86400
search_cache = ""
# Skiplist TOML with `repos`/`paths` entries.
skiplist = "skiplist.toml"
license_cache = ""
