[workspace]
resolver = "2"
members = [
    "crates/rebaze-bcr",
    "crates/rebaze-bzlmod",
    "crates/rebaze-cli",
    "crates/rebaze-core",
    "crates/rebaze-cmake",
    "crates/rebaze-cmake-file-api",
    "crates/rebaze-gradle",
    "crates/rebaze-bazel",
    "crates/rebaze-starlark",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/albertocavalcante/rebaze"
rust-version = "1.90"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_starlark = "0.1"
toml = "0.8"

# File system
walkdir = "2"
globset = "0.4"

# Terminal
colored = "3"
indicatif = "0.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parsing
chumsky = "0.9"
ariadne = "0.4"
cmake-file-api = "0.1.2"

# Internal crates
rebaze-bcr = { path = "crates/rebaze-bcr" }
rebaze-cmake = { path = "crates/rebaze-cmake" }
rebaze-cmake-file-api = { path = "crates/rebaze-cmake-file-api" }
rebaze-core = { path = "crates/rebaze-core" }
rebaze-gradle = { path = "crates/rebaze-gradle" }
rebaze-bazel = { path = "crates/rebaze-bazel" }
rebaze-starlark = { path = "crates/rebaze-starlark" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Allow these pedantic/nursery lints that are too strict (priority 1 to override group denies)
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
redundant_else = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
collapsible_if = { level = "allow", priority = 1 }
collapsible_else_if = { level = "allow", priority = 1 }
if_not_else = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
significant_drop_tightening = { level = "allow", priority = 1 }
