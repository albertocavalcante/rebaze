[workspace]
resolver = "2"
members = [
    "crates/rebaze-cli",
    "crates/rebaze-core",
    "crates/rebaze-cmake",
    "crates/rebaze-cmake-file-api",
    "crates/rebaze-gradle",
    "crates/rebaze-bazel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/albertocavalcante/rebaze"
rust-version = "1.80"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_starlark = "0.1"
toml = "0.8"

# File system
walkdir = "2"
globset = "0.4"

# Terminal
colored = "3"
indicatif = "0.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parsing
chumsky = "0.9"
ariadne = "0.4"
cmake-file-api = "0.1.2"

# Internal crates
rebaze-cmake = { path = "crates/rebaze-cmake" }
rebaze-cmake-file-api = { path = "crates/rebaze-cmake-file-api" }
rebaze-core = { path = "crates/rebaze-core" }
rebaze-gradle = { path = "crates/rebaze-gradle" }
rebaze-bazel = { path = "crates/rebaze-bazel" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Allow these pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
